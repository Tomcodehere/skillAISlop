name: CI — routeur & conformité

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer sqlite-vec
        run: pip install sqlite-vec

      - name: Build skills.db
        run: python3 outils/routage.py build

      - name: Synchronisation canvas (R8)
        run: python3 outils/routage.py generate --check

      - name: Lint synonymes & tests
        run: python3 outils/routage.py lint

      - name: Tests de non-régression du routage
        run: python3 outils/routage.py test

      - name: Audit de conformité R1-R8 (R5)
        run: >
          python3 outils/audit_conformite.py
          canvas/bibliotheque-skills-ai.md
          canvas/corpus-skills-1-300.md
          canvas/corpus-skills-301-600.md
          canvas/corpus-skills-601-900.md
          canvas/corpus-skills-901-1200.md

      - name: Sonde de couverture (bloquante, 100 % attendu)
        run: python3 outils/routage.py sonde

      - name: Vocabulaire FTS (rapport informatif)
        run: python3 outils/routage.py vocab --limit 15
        continue-on-error: true

      - name: Historique des versions (rapport informatif)
        run: python3 outils/routage.py versions
        continue-on-error: true

      - name: Génération SKILL.md (interop Agent Skills)
        run: python3 outils/routage.py skillmd
        continue-on-error: true

      - name: Smoke test API locale (serve, loopback)
        run: |
          python3 outils/routage.py serve --port 8799 &
          sleep 2
          python3 -c "import json,urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8799/health')))"
          kill %1
        continue-on-error: true

      - name: Pack exportable fidèle (build --from-skills + pack --check)
        run: |
          python3 outils/routage.py pack
          python3 outils/routage.py pack --check

      - name: Compteur à jour (R8)
        run: |
          python3 outils/routage.py count --dossier /tmp/count-check
          diff <(grep -m1 "Total" data/totalSkillsCount.md) <(grep -m1 "Total" /tmp/count-check/totalSkillsCount.md)
